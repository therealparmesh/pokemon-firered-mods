name: Build and verify both games
on:
  push:
    branches: [native-mods]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roms:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOBS: 2
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev pkg-config python3 perl cmake
      - name: Set up pinned compiler and headless emulator
        run: make setup
      - name: Verify exact upstream baselines
        run: make baseline
      - name: Build and test both games and verify BPS patches
        run: make patches
      - name: Verify failure cleanup
        run: python3 tests/pipeline_failures.py
      # ROMs, saves, and emulator states stay on the ephemeral runner.
      # No binary artifacts or releases are uploaded by this workflow.
      - name: Summarize verified outputs
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for game in ('firered', 'leafgreen'):
                  result = json.loads(pathlib.Path('tests/output', game, 'results.json').read_text())
                  summary.write(f"- {game}: {len(result['passed'])} emulator checks passed; SHA-256 `{result['rom_sha256']}`\n")
          PY
